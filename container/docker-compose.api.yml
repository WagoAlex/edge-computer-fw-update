# WAGO Edge Computer - WDA-compatible REST API only.
#
# Same MODE=server API as docker-compose.server.yml, but on the image WITHOUT
# the ~1.3 GB .raucb baked in: 238 MB instead of 2.8 GB. Build it with
#   docker build --target base -t wagoalex/wago-fw-update-edge-computer:api-latest .
#
# What changes without an embedded bundle: `start` with an empty UploadFiles
# answers code 26 / "no embedded bundle and no UploadFiles given". Get a payload
# in either by uploading it (getuploadids + PATCH /files/{id}) or by mounting a
# bundle and pointing BUNDLE at it - see the commented lines at the bottom.
#
# On the edge, once, or 443 stays closed - host mode is not behind Docker's
# port publishing, so firewalld applies:
#   firewall-cmd --permanent --zone=public --add-port=443/tcp && firewall-cmd --reload
#
# Start:  WDA_PASSWORD=... docker compose -f docker-compose.api.yml up -d
services:
  edge-fwupdate-api:
    image: wagoalex/wago-fw-update-edge-computer:api-latest
    container_name: wago-edge-wda-api
    restart: unless-stopped

    # The 0-0-networking-* reads need the HOST network namespace - a container's
    # own netns has no X1/X2/X11/X12. Host mode also puts the API straight on
    # 443, where an unmodified WDA client (https://<ip>/wda) looks, so there is
    # no port mapping (host mode forbids one).
    network_mode: host

    environment:
      MODE: server
      PORT: 443
      WDA_USER: ${WDA_USER:-admin}
      WDA_PASSWORD: ${WDA_PASSWORD:?set WDA_PASSWORD}
      WDA_LOG_LEVEL: INFO       # DEBUG also logs /health and every upload chunk
      ORDER_NUMBER: ${ORDER_NUMBER:-0752-9xxx}
      FIRMWARE_VERSION: ${FIRMWARE_VERSION:-04.01.00}
      PASSWD_FILE: /host/etc/passwd
      # WDA_TLS: "false"        # plain HTTP, debug only
      # WDA_AUTH: "false"       # no Basic auth, debug only

    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket   # reaches host rauc.service
      - /etc/rauc/keyring.pem:/etc/rauc/keyring.pem:ro            # signature verification
      - /docker/rauc-stage:/docker/rauc-stage                     # SAME path host + container
      - ./data:/app/data                                          # custom presets survive redeploy
      - /etc/passwd:/host/etc/passwd:ro                           # host accounts for 0-0-localusers-*
      # - /etc/wda/cert.pem:/run/wda/cert.pem:ro                  # your own TLS cert
      # - /etc/wda/key.pem:/run/wda/key.pem:ro

    healthcheck:
      # python3, not curl: the image ships neither curl nor wget. Tries https
      # then http, so it still works with WDA_TLS=false.
      test:
        - CMD
        - python3
        - -c
        - |
          import os, ssl, sys, urllib.request as u
          ctx = ssl._create_unverified_context()
          port = os.environ.get("PORT", "8443")
          for scheme in ("https", "http"):
              try:
                  if u.urlopen(f"{scheme}://127.0.0.1:{port}/health",
                               context=ctx, timeout=5).status == 200:
                      sys.exit(0)
              except Exception:
                  pass
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Restore the embedded-bundle route without rebuilding the image:
    # environment:
    #   BUNDLE: /firmware/bundle.raucb
    # volumes:
    #   - /docker/firmware/WAGO_OS0752-9xxx_Edge_FW5_V040100_IX05.raucb:/firmware/bundle.raucb:ro
