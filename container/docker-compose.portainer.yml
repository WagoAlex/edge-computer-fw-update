# Portainer stack: the WDA-compatible REST API on the edge, no embedded bundle.
#
# Paste this into Portainer -> Stacks -> Add stack -> Web editor, set the two
# environment variables below in the stack's own "Environment variables" box,
# and deploy. Differences from docker-compose.api.yml that matter in Portainer:
#
#   * absolute host paths only - a stack has no build context, so `./data`
#     would resolve somewhere you did not intend,
#   * no `${VAR:?}` guards - Portainer does not fail a stack on them, it
#     substitutes empty, so the password is a plain variable you must set,
#   * `network_mode: host` binds PORT on the device directly. Port 443 is
#     already taken if the current wago-edge-wda-api stack is still running:
#     stop that stack first, or set PORT to something free.
#
# Required stack environment variables:
#   WDA_PASSWORD   the Basic-auth password (there is no safe default)
#   PORT           443 to replace the existing deployment, else e.g. 18443
services:
  wago-edge-wda-api:
    image: wagoalex/wago-fw-update-edge-computer:api-latest
    container_name: wago-edge-wda-api
    restart: unless-stopped
    network_mode: host

    environment:
      MODE: server
      PORT: ${PORT:-443}
      WDA_USER: ${WDA_USER:-admin}
      WDA_PASSWORD: ${WDA_PASSWORD}
      WDA_LOG_LEVEL: ${WDA_LOG_LEVEL:-INFO}
      ORDER_NUMBER: ${ORDER_NUMBER:-0752-9xxx}
      FIRMWARE_VERSION: ${FIRMWARE_VERSION:-04.01.00}
      PASSWD_FILE: /host/etc/passwd
      # Writable hostname/DNS: values live here and are re-applied at start.
      NETWORK_CUSTOM_STORE: /app/data/network-custom.json

    volumes:
      # The one mount the writes depend on: hostname1 and NetworkManager are
      # reached over this socket, the same way rauc is.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/rauc/keyring.pem:/etc/rauc/keyring.pem:ro
      - /docker/rauc-stage:/docker/rauc-stage
      - /docker/wda/data:/app/data
      - /etc/passwd:/host/etc/passwd:ro

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, ssl, sys, urllib.request as u
          ctx = ssl._create_unverified_context()
          port = os.environ.get("PORT", "8443")
          for scheme in ("https", "http"):
              try:
                  if u.urlopen(f"{scheme}://127.0.0.1:{port}/health",
                               context=ctx, timeout=5).status == 200:
                      sys.exit(0)
              except Exception:
                  pass
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
