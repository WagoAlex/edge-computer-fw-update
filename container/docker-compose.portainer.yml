# Portainer stack: the WDA REST API on the edge - the DEVICE half, on its own.
#
# Paste into Portainer -> Stacks -> Add stack -> Web editor, set the variables
# in the stack's own "Environment variables" box, deploy.
#
# This is the ONLY WDA server on the device: every 0-0-* parameter, the RAUC
# firmware-update state machine, and activation. The sibling project
# edge-commissioning-service is a pure HTTP client of it.
#
# PAIRS WITH THE COMMISSIONING PROJECT. The service block below is identical to
# the wago-edge-wda-api service in edge-commissioning-service's own
# docker-compose.portainer.yml - same service name, container name, image, env,
# mounts and healthcheck - so the two are interchangeable:
#
#   this file          device half only (no Device Sphere)
#   sibling's file     device half + commissioning agent, one stack
#
# Run ONE of them, never both: they claim the same container name and the same
# PORT. To add Device Sphere later, delete this stack and deploy the sibling's.
#
# Portainer specifics, learned the hard way:
#   * no `build:` - a stack has no build context, the image comes from the registry
#   * no `${VAR:?}` guards - Portainer substitutes empty instead of failing, so a
#     missing WDA_PASSWORD would deploy a broken stack silently
#   * absolute host paths only - `./data` would resolve somewhere you did not intend
#   * `network_mode: host` binds PORT directly; 443 is taken if an older
#     wago-edge-wda-api stack is still up. Stop it first or set PORT=18443.
#
# Required stack environment variables:
#   WDA_PASSWORD   Basic-auth password for the WDA API. No safe default.
#
# Worth setting:
#   PORT           443 normally, 18443 to run beside an existing stack
services:

  wago-edge-wda-api:
    image: wagoalex/wago-fw-update-edge-computer:api-latest
    container_name: wago-edge-wda-api
    restart: unless-stopped
    network_mode: host

    environment:
      MODE: server
      PORT: ${PORT:-443}
      WDA_USER: ${WDA_USER:-admin}
      WDA_PASSWORD: ${WDA_PASSWORD}
      WDA_LOG_LEVEL: ${WDA_LOG_LEVEL:-INFO}
      ORDER_NUMBER: ${ORDER_NUMBER:-0752-9xxx}
      FIRMWARE_VERSION: ${FIRMWARE_VERSION:-04.01.00}
      PASSWD_FILE: /host/etc/passwd
      NETWORK_CUSTOM_STORE: /app/data/network-custom.json

    volumes:
      # hostname1, NetworkManager and rauc are all reached over this socket.
      # This is what makes the writable parameters work without a privilege:
      # systemd or NetworkManager does the privileged part, polkit decides.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/rauc/keyring.pem:/etc/rauc/keyring.pem:ro
      # SAME path on host and in the container - rauc resolves it host-side.
      - /docker/rauc-stage:/docker/rauc-stage
      - /docker/wda/data:/app/data
      - /etc/passwd:/host/etc/passwd:ro
      # Opt-in, and only if you want 0-0-networking-routing-ipforwarding-enabled
      # to be writable. Without it that one id answers 503 naming this mount.
      # - /etc/sysctl.d:/etc/sysctl.d

    healthcheck:
      # python3, not curl: the image ships neither curl nor wget. Tries https
      # then http, so it still works with WDA_TLS=false.
      test:
        - CMD
        - python3
        - -c
        - |
          import os, ssl, sys, urllib.request as u
          ctx = ssl._create_unverified_context()
          port = os.environ.get("PORT", "8443")
          for scheme in ("https", "http"):
              try:
                  if u.urlopen(f"{scheme}://127.0.0.1:{port}/health",
                               context=ctx, timeout=5).status == 200:
                      sys.exit(0)
              except Exception:
                  pass
          sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# After deploying, the startup line in the container log tells you what this
# build actually serves:
#
#   listening on https://0.0.0.0:443 ... params=59+dynamic writable=10 methods=15
#
# Firmware over REST (no bundle in this image - upload one):
#   activate -> getuploadids -> PATCH /files/{id} -> start -> finish
#   then     -> 0-0-firmwareupdate-reboot (inArgs Confirm=true)  EXPLICIT
#   then     -> 0-0-firmwareupdate-confirm                       after the reboot
#
# Read the activation state back at any time, including after a restart - it
# comes from rauc, not from the container's memory:
#   0-0-firmwareupdate-activationstate   4 Unconfirmed / 5 Confirmed / 9 no rauc
#   0-0-firmwareupdate-pendingslot       the slot staged for the next boot
#
# Every id a client asks for that this build does not serve is logged once:
#   docker logs wago-edge-wda-api 2>&1 | grep -o 'unimplemented .*' | sort -u
